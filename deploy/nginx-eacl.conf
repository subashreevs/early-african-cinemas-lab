# Example matching the current Jetstream2 staging site. A new host/domain must
# use its own hostname and certificate paths. Test with nginx -t before reload.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 149.165.171.224;

    root /var/www/eacl;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 149.165.171.224;

    ssl_certificate /etc/letsencrypt/live/149.165.171.224/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/149.165.171.224/privkey.pem;

    root /var/www/eacl;
    index index.html;

    location ^~ /uploads/posters/ {
        alias /media/volume/eacl-data-volume/uploads/posters/;
    }

    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
